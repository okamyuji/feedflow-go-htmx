{{ define "_tree.html" }}
<nav class="tree" aria-label="購読ツリー">
  <ul class="tree-list tree-nav">
    {{ range .Tree }}{{ if ne .Kind "feed" }}{{ template "_tree_node.html" . }}{{ end }}{{ end }}
  </ul>

  <div class="feed-filter">
    <input
      class="feed-filter-input"
      type="search"
      placeholder="フィードを絞り込む"
      aria-label="フィードを絞り込む"
      autocomplete="off"
      x-model="feedFilter"
      x-init="applyFeedFilter"
      @input="onFeedFilter"
      @keydown.escape="clearFeedFilter"
    >
    <button
      class="feed-filter-clear"
      type="button"
      aria-label="絞り込みを解除"
      @click="clearFeedFilter"
      x-show="feedFilter"
      style="display:none"
    >×</button>
  </div>

  <ul class="tree-list tree-feeds">
    {{ range .Tree }}{{ if eq .Kind "feed" }}{{ template "_tree_node.html" . }}{{ end }}{{ end }}
    <li class="tree-feed-empty" style="display:none">該当するフィードがありません</li>
  </ul>

  <form
    class="subscribe-form"
    hx-post="/app/feeds"
    hx-target="#main-pane"
    hx-swap="innerHTML"
  >
    <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
    <input class="field-input" type="url" name="url" placeholder="フィードURLまたはサイトURL" required>
    <button class="btn-primary" type="submit">購読する</button>
  </form>
</nav>
{{ end }}
