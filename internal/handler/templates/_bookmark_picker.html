{{ define "_bookmark_picker.html" }}
<div
  class="bookmark-picker"
  id="bookmark-picker-{{ .ItemID }}"
  x-init="$dispatch('bm-changed-{{ .ItemID }}', { active: {{ if .Bookmarked }}true{{ else }}false{{ end }} })"
>
  {{/* 保存(ブックマーク)状態のトグル。ラベル付け外しとは独立し、ラベルが無くても保存は維持されます。 */}}
  <div class="bookmark-save">
    {{ if .Bookmarked }}
    <button
      type="button"
      class="bookmark-save-btn is-saved"
      hx-post="/app/items/{{ .FeedID }}/{{ .ItemID }}/bookmark"
      hx-vals='{"bookmarked": "false", "surface": "picker"}'
      hx-target="#bookmark-picker-{{ .ItemID }}"
      hx-swap="outerHTML"
    >ブックマーク解除</button>
    {{ else }}
    <button
      type="button"
      class="bookmark-save-btn"
      hx-post="/app/items/{{ .FeedID }}/{{ .ItemID }}/bookmark"
      hx-vals='{"bookmarked": "true", "surface": "picker"}'
      hx-target="#bookmark-picker-{{ .ItemID }}"
      hx-swap="outerHTML"
    >ブックマークに保存</button>
    {{ end }}
  </div>
  {{/* ラベル(任意の分類)。チェックで付け外し。付けると自動で保存済みになります。 */}}
  <ul class="bookmark-options">
    {{ range .Options }}
    <li>
      <button
        type="button"
        class="bookmark-option{{ if .Checked }} is-checked{{ end }}"
        aria-pressed="{{ if .Checked }}true{{ else }}false{{ end }}"
        hx-post="/app/items/{{ $.FeedID }}/{{ $.ItemID }}/bookmarks/toggle"
        hx-vals='{"bookmark": "{{ .ID }}"}'
        hx-target="#bookmark-picker-{{ $.ItemID }}"
        hx-swap="outerHTML"
      >
        <span class="bookmark-check" aria-hidden="true">{{ if .Checked }}✓{{ end }}</span>
        <span class="bookmark-name">{{ .Name }}</span>
      </button>
    </li>
    {{ else }}
    <li class="bookmark-empty">まだラベルはありません</li>
    {{ end }}
  </ul>
  <form
    class="bookmark-create"
    hx-post="/app/bookmarks"
    hx-target="#bookmark-picker-{{ .ItemID }}"
    hx-swap="outerHTML"
  >
    <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
    <input type="hidden" name="feed" value="{{ .FeedID }}">
    <input type="hidden" name="item" value="{{ .ItemID }}">
    <input
      class="bookmark-create-input"
      type="text"
      name="name"
      placeholder="＋ 新しいラベルを作成"
      aria-label="新しいラベル名"
      autocomplete="off"
      required
    >
  </form>
</div>
{{ end }}
