{{ define "_item_card.html" }}
{{ if .UnreadStart }}<li class="item-unread-divider" aria-hidden="true"><span>ここから未読</span></li>{{ end }}
<li
  class="item-card{{ if .Read }} is-read{{ end }}"
  id="item-{{ .ID }}"
  data-feed="{{ .FeedID }}"
  data-item="{{ .ID }}"
  x-data="{ bmOpen: false }"
>
  <a
    class="item-open"
    href="{{ .Link }}"
    hx-get="/app/items/{{ .FeedID }}/{{ .ID }}"
    hx-target="#reading-overlay"
    hx-swap="innerHTML"
    @click.prevent="openOverlay"
  >
    <h3 class="item-title">{{ .Title }}</h3>
    <p class="item-summary">{{ .Summary }}</p>
    <div class="item-meta">
      <time>{{ .PublishedAt }}</time>
      <span class="item-bookmark" id="bm-indicator-{{ .ID }}">{{ if .Bookmarked }}🔖 保存済み{{ end }}</span>
    </div>
  </a>
  <div class="item-quick">
    <button
      class="quick-btn bookmark-btn"
      type="button"
      :aria-expanded="bmOpen"
      @click="bmOpen = !bmOpen"
      hx-get="/app/items/{{ .FeedID }}/{{ .ID }}/bookmarks"
      hx-target="#bm-panel-{{ .ID }}"
      hx-swap="innerHTML"
    >🔖 ブックマーク</button>
    <button
      class="quick-btn"
      hx-post="/app/items/{{ .FeedID }}/{{ .ID }}/read"
      hx-vals='{"read": "{{ if .Read }}false{{ else }}true{{ end }}"}'
      hx-target="#item-{{ .ID }}"
      hx-swap="outerHTML"
    >{{ if .Read }}未読に戻す{{ else }}既読{{ end }}</button>
  </div>
  <div
    class="bookmark-panel"
    id="bm-panel-{{ .ID }}"
    x-show="bmOpen"
    x-transition
    @click.outside="bmOpen = false"
    style="display:none"
  ></div>
</li>
{{ end }}
