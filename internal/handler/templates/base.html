{{ define "base.html" }}
<!doctype html>
<html lang="ja" data-theme="{{ if isDark .Theme }}dark{{ else }}light{{ end }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }}</title>
  <link rel="icon" href="data:,">
  <meta name="csrf-token" content="{{ .CSRFToken }}">
  <!-- htmxの履歴キャッシュを無効化しますlocalStorageへのスナップショット保存失敗(historyCacheError)を防ぎます。戻る操作はサーバーから再取得します -->
  <meta name="htmx-config" content='{"historyCacheSize":0}'>
  <link rel="stylesheet" href="/static/styles.css?v={{ staticVersion "styles.css" }}">
  <script src="/static/htmx.min.js?v={{ staticVersion "htmx.min.js" }}" defer></script>
  <script src="/static/app.js?v={{ staticVersion "app.js" }}" defer></script>
  <script src="/static/alpine.min.js?v={{ staticVersion "alpine.min.js" }}" defer></script>
</head>
<body
  x-data="feedflow"
  @keydown.window="onKey"
  hx-headers='{"X-CSRF-Token": "{{ .CSRFToken }}"}'
  data-auto-read="{{ if .AutoReadOnScroll }}true{{ else }}false{{ end }}"
>
  <div class="app-shell">
    <header class="app-bar">
      <div class="app-bar-left">
        <button class="icon-btn" @click="toggleSidebar" aria-label="サイドバー切替">☰</button>
        <span class="app-brand">feedflow</span>
      </div>
      <div class="app-actions">
        <button class="icon-btn" @click="toggleTheme" aria-label="テーマ切替">
          <span x-text="themeLabel"></span>
        </button>
        <a class="icon-btn" href="/app/settings" hx-get="/app/settings" hx-target="#main-pane" hx-push-url="true">設定</a>
        <form method="post" action="/logout" class="inline-form">
          <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
          <button class="icon-btn" type="submit">ログアウト</button>
        </form>
      </div>
    </header>

    <div class="app-body" :class="sidebarClass">
      {{ template "_tree_pane.html" . }}

      <main
        class="main-pane"
        id="main-pane"
        @scroll.debounce.200ms="onListScroll"
      >
        {{ if eq .MainView "settings" }}{{ template "_settings.html" . }}{{ else }}{{ template "_item_list.html" . }}{{ end }}
      </main>
    </div>
  </div>

  <div
    class="overlay-backdrop"
    x-show="overlayOpen"
    x-transition.opacity
    @click="closeOverlay"
    style="display:none"
  ></div>
  <section
    class="reading-overlay"
    id="reading-overlay"
    x-show="overlayOpen"
    x-transition
    @scroll.debounce.300ms="onOverlayScroll"
    style="display:none"
  >
    {{ if .ActiveItem }}{{ template "_item_overlay.html" .ActiveItem }}{{ end }}
  </section>
</body>
</html>
{{ end }}
