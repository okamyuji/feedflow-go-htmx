title = "feedflow-go-htmx gitleaks config"

# gitleaks内蔵のデフォルトルール一式を継承する。
# これがないとallowlistのみが読まれてルール0件となり何も検出できない。
[extend]
useDefault = true

[allowlist]
description = """\
.env.exampleはマスク済みのサンプルなのでallowlist。
.envはローカル専用かつ.gitignoreで保護されておりgitに混入しないため
作業ツリーのno-git scanからは除外する。
docs/superpowers配下の計画書はE2Eハードニング用のテスト鍵を例示として含むため
ドキュメントとして除外する。これらは実値ではなくテスト専用の固定文字列である。
scripts/verify-hardening.shはローカル検証専用でFEEDFLOW_SESSION_KEYに固定の
テスト鍵を埋め込むため除外する。これは実値ではなく検証スクリプト用の固定文字列である。
deploy/terraform配下のtfstateとsecrets.auto.tfvarsとpemはいずれも.gitignoreで保護された
ローカル専用の成果物でgitに混入しない。terraform apply後にローカルへ生成される実値だが
追跡対象外のため、作業ツリーのno-git scanからは除外する。secrets.auto.tfvars.exampleは
マスク済みのテンプレートで追跡対象だがプレースホルダのみのため誤検出しない。
graphify-outと.code-review-graphはコード解析ツールの生成物で、ソース中のテスト鍵を複製するため除外する。
"""
paths = [
  '''\.env\.example''',
  '''^graphify-out/''',
  '''^\.code-review-graph/''',
  '''^\.env$''',
  '''^docs/superpowers/''',
  '''^scripts/verify-hardening\.sh$''',
  '''^deploy/terraform/.*\.tfstate.*$''',
  '''^deploy/terraform/secrets\.auto\.tfvars$''',
  '''^deploy/terraform/.*\.pem$''',
]
regexes = [
  '''\*\*\*MASKED\*\*\*''',
]
